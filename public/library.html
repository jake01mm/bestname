<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>域名库 - 智能域名生成器</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .library-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      flex-wrap: wrap;
      gap: 15px;
    }
    
    .search-box {
      flex: 1;
      min-width: 200px;
    }
    
    .search-box input {
      width: 100%;
      padding: 14px 16px;
      border: 3px solid #48dbfb;
      border-radius: 10px;
      font-size: 1.05em;
      background: #0f1729;
      color: #e0e6ed;
      font-weight: 600;
      box-shadow: 
        inset 0 2px 8px rgba(0, 0, 0, 0.4),
        0 0 0 0 rgba(72, 219, 251, 0);
      transition: all 0.3s;
    }
    
    .search-box input:focus {
      outline: none;
      border-color: #ff6b6b;
      box-shadow: 
        inset 0 2px 8px rgba(0, 0, 0, 0.4),
        0 0 0 4px rgba(255, 107, 107, 0.3),
        0 0 20px rgba(255, 107, 107, 0.4);
    }
    
    .search-box input::placeholder {
      color: #6c7a89;
    }
    
    .filter-controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    
    .filter-controls select {
      padding: 12px 16px;
      border: 3px solid #48dbfb;
      border-radius: 10px;
      font-size: 0.95em;
      cursor: pointer;
      background: #0f1729;
      color: #e0e6ed;
      font-weight: 600;
      transition: all 0.3s;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.4);
    }
    
    .filter-controls select:hover {
      border-color: #fdcb6e;
      box-shadow: 
        inset 0 2px 8px rgba(0, 0, 0, 0.4),
        0 0 15px rgba(253, 203, 110, 0.3);
    }
    
    .filter-controls select:focus {
      outline: none;
      border-color: #ff6b6b;
    }
    
    .domain-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      background: #1e2749;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 
        0 0 0 3px #48dbfb,
        0 10px 40px rgba(0, 0, 0, 0.5);
      border: 4px solid #2d3561;
    }
    
    .domain-table th {
      background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
      color: white;
      padding: 18px;
      text-align: left;
      font-weight: 800;
      cursor: pointer;
      user-select: none;
      border-bottom: 3px solid #2d3561;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
      letter-spacing: 0.5px;
      transition: all 0.3s;
      position: relative;
    }
    
    .domain-table th::after {
      content: '▼';
      position: absolute;
      right: 10px;
      opacity: 0;
      transition: opacity 0.3s;
      font-size: 0.8em;
    }
    
    .domain-table th:hover {
      background: linear-gradient(135deg, #ee5a6f 0%, #ff6b6b 100%);
      transform: translateY(-2px);
    }
    
    .domain-table th:hover::after {
      opacity: 1;
    }
    
    .domain-table td {
      padding: 15px 18px;
      border-bottom: 2px solid #2d3561;
      color: #e0e6ed;
      font-weight: 600;
      background: rgba(30, 39, 73, 0.5);
    }
    
    .domain-table tr:hover td {
      background: rgba(72, 219, 251, 0.1);
      color: #48dbfb;
    }
    
    .domain-table tr:last-child td {
      border-bottom: none;
    }
    
    .domain-name {
      font-weight: 800;
      color: #48dbfb;
      font-size: 1.15em;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
      letter-spacing: 0.5px;
    }
    
    .score-badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 0.95em;
      border: 2px solid;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
    }
    
    .score-high { 
      background: linear-gradient(135deg, #55efc4 0%, #00b894 100%); 
      color: white; 
      border-color: #00b894;
      box-shadow: 0 0 15px rgba(85, 239, 196, 0.5);
    }
    .score-good { 
      background: linear-gradient(135deg, #48dbfb 0%, #0984e3 100%); 
      color: white; 
      border-color: #0984e3;
      box-shadow: 0 0 15px rgba(72, 219, 251, 0.5);
    }
    .score-medium { 
      background: linear-gradient(135deg, #fdcb6e 0%, #e17055 100%); 
      color: white; 
      border-color: #e17055;
      box-shadow: 0 0 15px rgba(253, 203, 110, 0.5);
    }
    .score-low { 
      background: linear-gradient(135deg, #ff6b6b 0%, #d63031 100%); 
      color: white; 
      border-color: #d63031;
      box-shadow: 0 0 15px rgba(255, 107, 107, 0.5);
    }
    .score-none { 
      background: #636e72; 
      color: white; 
      border-color: #2d3436;
    }
    
    .confidence-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.85em;
      font-weight: 800;
      border: 2px solid;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .confidence-high { 
      background: rgba(85, 239, 196, 0.2); 
      color: #55efc4; 
      border-color: #55efc4;
    }
    .confidence-medium { 
      background: rgba(253, 203, 110, 0.2); 
      color: #fdcb6e; 
      border-color: #fdcb6e;
    }
    .confidence-low { 
      background: rgba(255, 107, 107, 0.2); 
      color: #ff6b6b; 
      border-color: #ff6b6b;
    }
    
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-top: 25px;
    }
    
    .pagination button {
      padding: 12px 24px;
      border: 3px solid #48dbfb;
      background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
      color: white;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1em;
      font-weight: 800;
      transition: all 0.3s;
      box-shadow: 0 5px 20px rgba(255, 107, 107, 0.4);
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
    }
    
    .pagination button:hover:not(:disabled) {
      transform: translateY(-3px);
      box-shadow: 0 8px 30px rgba(255, 107, 107, 0.6);
      border-color: #fdcb6e;
    }
    
    .pagination button:disabled {
      background: #636e72;
      cursor: not-allowed;
      opacity: 0.5;
      box-shadow: none;
      border-color: #2d3436;
    }
    
    .pagination span {
      color: #48dbfb;
      font-size: 1em;
      font-weight: 700;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
    }
    
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }
    
    .stat-item {
      background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 
        0 0 0 2px #48dbfb,
        0 8px 25px rgba(255, 107, 107, 0.4);
      text-align: center;
      border: 3px solid #2d3561;
      transition: transform 0.3s;
    }
    
    .stat-item:hover {
      transform: translateY(-5px) scale(1.05);
    }
    
    .stat-value {
      font-size: 2.5em;
      font-weight: 900;
      color: white;
      text-shadow: 
        2px 2px 0 #2d3561,
        3px 3px 10px rgba(0, 0, 0, 0.5);
    }
    
    .stat-label {
      font-size: 0.95em;
      color: white;
      font-weight: 700;
      margin-top: 5px;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
    }
    
    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      color: white;
      text-decoration: none;
      font-size: 1.2em;
      font-weight: 800;
      padding: 12px 24px;
      background: linear-gradient(135deg, #a29bfe 0%, #6c5ce7 100%);
      border-radius: 10px;
      border: 3px solid #2d3561;
      box-shadow: 
        0 0 0 2px #48dbfb,
        0 5px 20px rgba(162, 155, 254, 0.4);
      transition: all 0.3s;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
      position: relative;
      z-index: 10;
      cursor: pointer;
    }
    
    .back-link:hover {
      transform: translateY(-3px);
      box-shadow: 
        0 0 0 2px #48dbfb,
        0 8px 30px rgba(162, 155, 254, 0.6);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div style="position: relative; z-index: 10;">
        <a href="/" class="back-link">← 返回生成器</a>
      </div>
      <h1>📚 域名库</h1>
      <p>浏览所有可用的域名</p>
    </header>

    <div class="config-panel">
      <div class="stats-bar" id="statsBar">
        <div class="stat-item">
          <div class="stat-value" id="totalDomains">-</div>
          <div class="stat-label">可用域名</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="scoredDomains">-</div>
          <div class="stat-label">已评分</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="avgScore">-</div>
          <div class="stat-label">平均分</div>
        </div>
      </div>

      <div class="library-header">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="搜索域名...">
        </div>
        
        <div class="filter-controls">
          <select id="minScoreFilter">
            <option value="0">所有评分</option>
            <option value="80">80分以上</option>
            <option value="70">70分以上</option>
            <option value="60">60分以上</option>
          </select>
          
          <select id="sortBy">
            <option value="ai_score">按评分排序</option>
            <option value="checked_at">按检测时间</option>
            <option value="domain">按域名排序</option>
          </select>
          
          <select id="sortOrder">
            <option value="DESC">降序</option>
            <option value="ASC">升序</option>
          </select>
        </div>
      </div>

      <table class="domain-table">
        <thead>
          <tr>
            <th>域名</th>
            <th>AI评分</th>
            <th>置信度</th>
            <th>发音</th>
            <th>记忆度</th>
            <th>品牌</th>
            <th>评价</th>
            <th>检测时间</th>
          </tr>
        </thead>
        <tbody id="domainTableBody">
          <tr>
            <td colspan="8" style="text-align: center; padding: 40px;">
              <div class="spinner"></div>
              <p>加载中...</p>
            </td>
          </tr>
        </tbody>
      </table>

      <div class="pagination">
        <button id="prevBtn" disabled>上一页</button>
        <span id="pageInfo">第 1 页</span>
        <button id="nextBtn">下一页</button>
      </div>
    </div>
  </div>

  <script src="library.js"></script>
</body>
</html>
