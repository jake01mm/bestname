<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#48dbfb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a29bfe;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 背景圆形 -->
  <circle cx="50" cy="50" r="48" fill="#0a0e27" stroke="url(#grad1)" stroke-width="4"/>
  
  <!-- 域名符号 .com -->
  <g filter="url(#glow)">
    <!-- 点 -->
    <circle cx="30" cy="50" r="6" fill="#48dbfb"/>
    
    <!-- 字母 D (代表 Domain) -->
    <path d="M 45 35 L 45 65 L 55 65 Q 70 65 70 50 Q 70 35 55 35 Z" 
          fill="none" stroke="#ff6b6b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- AI 星光效果 -->
    <path d="M 75 25 L 77 30 L 82 32 L 77 34 L 75 39 L 73 34 L 68 32 L 73 30 Z" 
          fill="#fdcb6e" opacity="0.9"/>
    <path d="M 85 45 L 86 48 L 89 49 L 86 50 L 85 53 L 84 50 L 81 49 L 84 48 Z" 
          fill="#a29bfe" opacity="0.9"/>
    <path d="M 20 30 L 21 33 L 24 34 L 21 35 L 20 38 L 19 35 L 16 34 L 19 33 Z" 
          fill="#55efc4" opacity="0.9"/>
  </g>
</svg>
